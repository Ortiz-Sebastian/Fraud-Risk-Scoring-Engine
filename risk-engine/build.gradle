plugins {
    id 'application'
}

application {
    mainClass = 'com.riskengine.engine.StreamingJob'
}

// Flink's Kryo serializer (twitter-chill) reflects into java.util and java.lang internals.
// Java 17+ module encapsulation blocks this by default. These flags must be applied to both
// the run task and the test task since each forks its own JVM process.
def flinkJvmArgs = [
    '--add-opens', 'java.base/java.util=ALL-UNNAMED',
    '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
    '--add-opens', 'java.base/java.io=ALL-UNNAMED'
]

tasks.named('run') {
    jvmArgs(flinkJvmArgs)
}

tasks.named('test') {
    jvmArgs(flinkJvmArgs)
}

dependencies {
    implementation project(':common')

    implementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
    implementation "org.apache.flink:flink-clients:${flinkVersion}"
    implementation "org.apache.flink:flink-connector-kafka:${flinkKafkaConnectorVersion}"
    implementation "org.apache.flink:flink-connector-base:${flinkVersion}"

    implementation "com.datastax.oss:java-driver-core:${cassandraDriverVersion}"
    implementation "org.postgresql:postgresql:${postgresDriverVersion}"
    implementation "redis.clients:jedis:${jedisVersion}"
    implementation "co.elastic.clients:elasticsearch-java:${elasticsearchVersion}"
    implementation "org.elasticsearch.client:elasticsearch-rest-client:${elasticsearchVersion}"
    implementation "io.prometheus:simpleclient:${prometheusVersion}"
    implementation "io.prometheus:simpleclient_httpserver:${prometheusVersion}"

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"

    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}
